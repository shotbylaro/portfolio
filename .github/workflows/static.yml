name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stáhnout aktuální PDF ze SharePointu
        run: |
          curl -sL -o /tmp/p.pdf "https://ozsjicz-my.sharepoint.com/:b:/g/personal/r_grigorascenko_ozs-ji_cz/IQA2kSADtis6TY7KniHyAMhNAd18QlbVXIqxv7DbPcEFngY?e=krESac&download=1"
          if head -c4 /tmp/p.pdf | grep -q '%PDF'; then mv /tmp/p.pdf portfolio.pdf; echo "PDF aktualizováno"; else echo "Stažení se nepovedlo, zůstává PDF z repozitáře"; fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
