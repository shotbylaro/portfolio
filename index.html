<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio – Roman Grigoraščenko | shotbylaro</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#070707;color:#eef0ef;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;background:rgba(7,7,7,.85);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.1)}
  .title{font-weight:700;letter-spacing:.02em}
  .title span{color:#4154d6}
  .right{display:flex;align-items:center;gap:10px}
  .dl{color:#cfd3d1;text-decoration:none;font-size:14px;padding:8px 14px;border:1px solid rgba(255,255,255,.2);border-radius:10px}
  .dl:hover{border-color:#4154d6;color:#fff}
  .close{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:#4154d6;color:#fff;text-decoration:none;font-size:22px;line-height:1}
  .close:hover{filter:brightness(1.12)}
  #pages{max-width:1100px;margin:0 auto;padding:18px;display:flex;flex-direction:column;gap:14px;align-items:center}
  .pg{position:relative}
  .pg canvas{display:block;max-width:100%;border-radius:10px;background:#fff}
  .pg a{position:absolute;display:block;border-radius:2px}
  .pg a:hover{background:rgba(65,84,214,.15)}
  #msg{text-align:center;padding:60px 20px;color:#9a9f9d}
  #msg a{color:#fff}
</style>
</head>
<body>
<div class="bar">
  <div class="title">Portfolio · shotby<span>laro</span></div>
  <div class="right">
    <a class="dl" href="portfolio2.pdf" download>Stáhnout PDF</a>
    <a class="close" href="https://www.shotbylaro.eu" aria-label="Zavřít">✕</a>
  </div>
</div>
<div id="pages"></div>
<div id="msg">Načítám portfolio…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const box=document.getElementById('pages'),msg=document.getElementById('msg');
pdfjsLib.getDocument('portfolio2.pdf?v='+Math.floor(Date.now()/60000)).promise.then(async pdf=>{
  msg.remove();
  const dpr=window.devicePixelRatio||1;
  for(let n=1;n<=pdf.numPages;n++){
    const page=await pdf.getPage(n);
    const w=Math.min(box.clientWidth-36,1064);
    const s=w/page.getViewport({scale:1}).width;
    const vp=page.getViewport({scale:s*dpr});      // pro ostré vykreslení
    const cssVp=page.getViewport({scale:s});       // pro pozice odkazů v CSS pixelech

    const wrap=document.createElement('div');
    wrap.className='pg';
    wrap.style.width=w+'px';
    wrap.style.height=cssVp.height+'px';

    const c=document.createElement('canvas');
    c.width=vp.width;c.height=vp.height;
    c.style.width=w+'px';c.style.height=cssVp.height+'px';
    wrap.appendChild(c);
    box.appendChild(wrap);

    await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;

    // Přidání klikacích odkazů z anotací PDF
    const anns=await page.getAnnotations();
    for(const a of anns){
      if(a.subtype!=='Link'||!a.url) continue;
      const [x1,y1,x2,y2]=cssVp.convertToViewportRectangle(a.rect);
      const link=document.createElement('a');
      link.href=a.url;
      link.target='_blank';
      link.rel='noopener noreferrer';
      link.setAttribute('aria-label',a.url);
      link.style.left=Math.min(x1,x2)+'px';
      link.style.top=Math.min(y1,y2)+'px';
      link.style.width=Math.abs(x2-x1)+'px';
      link.style.height=Math.abs(y2-y1)+'px';
      wrap.appendChild(link);
    }
  }
}).catch(()=>{msg.innerHTML='PDF se nepodařilo načíst. <a href="portfolio2.pdf">Otevřít přímo</a>'});
</script>
</body>
</html>
